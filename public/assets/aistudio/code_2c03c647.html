<script data-purpose="ui-interactions">
    document.addEventListener('DOMContentLoaded', () => {
      // Toggle play button visual feedback
      const playBtn = document.querySelector('button[aria-label="Play video"]');
      if (playBtn) {
        playBtn.addEventListener('click', () => {
          playBtn.classList.toggle('opacity-0');
        });
      }

      // Like interaction toggle
      const likeBtn = document.querySelector('button[aria-label="Like clip"]');
      if (likeBtn) {
        likeBtn.addEventListener('click', () => {
          likeBtn.classList.toggle('scale-125');
          setTimeout(() => likeBtn.classList.remove('scale-125'), 180);
        });
      }
    });
  </script>
<!-- END: Interactive Feedback Script -->
